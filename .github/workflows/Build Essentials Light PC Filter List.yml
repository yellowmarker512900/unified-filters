name: Build Essentials Light PC Filter List

permissions:
  contents: write

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Combine and Clean Filterlists for PC
        run: |
          mkdir -p filters
          cd filters

          echo "[Adblock Plus 2.0]" > essentials_light_pc_raw.txt
          echo "! Title: Essentials Light PC Filterlist" >> essentials_light_pc_raw.txt
          echo "! Author: anonym" >> essentials_light_pc_raw.txt
          echo "! Description: Optimiert für Streaming, YouTube und normale Seiten" >> essentials_light_pc_raw.txt
          echo "! Version: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> essentials_light_pc_raw.txt
          echo "" >> essentials_light_pc_raw.txt

          urls=(
            "https://raw.githubusercontent.com/yokoffing/filterlists/refs/heads/main/privacy_essentials.txt"
            "https://raw.githubusercontent.com/yokoffing/filterlists/refs/heads/main/annoyance_list.txt"
            "https://raw.githubusercontent.com/yokoffing/filterlists/refs/heads/main/block_third_party_fonts.txt"
            "https://raw.githubusercontent.com/yokoffing/filterlists/refs/heads/main/click2load.txt"
            "https://raw.githubusercontent.com/DandelionSprout/adfilt/refs/heads/master/LegitimateURLShortener.txt"
            "https://raw.githubusercontent.com/hagezi/dns-blocklists/refs/heads/main/adblock/spam-tlds-ublock.txt"
            "https://raw.githubusercontent.com/DandelionSprout/adfilt/refs/heads/master/Dandelion%20Sprout's%20Anti-Malware%20List.txt"
            "https://raw.githubusercontent.com/iam-py-test/my_filters_001/refs/heads/main/antimalware.txt"
            "https://raw.githubusercontent.com/DandelionSprout/adfilt/refs/heads/master/ClearURLs%20for%20uBo/clear_urls_uboified.txt"
            "https://fanboy.co.nz/fanboy-cookiemonster.txt"
          )

          for url in "${urls[@]}"; do
            filename=$(basename "$url")
            echo -e "\n\n! =============== Source: $filename ===============" >> essentials_light_pc_raw.txt
            curl -s "$url" | grep -vE '^(!|\s*$)' >> essentials_light_pc_raw.txt
          done

          grep -v '^!' essentials_light_pc_raw.txt | sort -u > essentials_light_pc_sorted.txt

          head -n 5 essentials_light_pc_raw.txt > essentials_light_pc.txt
          echo "" >> essentials_light_pc.txt
          cat essentials_light_pc_sorted.txt >> essentials_light_pc.txt

      - name: Commit & Push
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add filters/essentials_light_pc.txt
          git commit -m "Update Essentials Light PC filter list"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
