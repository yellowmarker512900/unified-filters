name: Build UBO Standard Filter List

permissions:
  contents: write

on:
  schedule:
    - cron: '0 5 * * *'  # Täglich um 5 Uhr früh
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Combine and Clean Filterlists
        run: |
          mkdir -p filters
          cd filters

          echo "[Adblock Plus 2.0]" > ubo_standard_raw.txt
          echo "! Title: UBO Standard Filter List" >> ubo_standard_raw.txt
          echo "! Author: anonym (yellowmarker512900)" >> ubo_standard_raw.txt
          echo "! Description: Unified filterlist for Brave/Firefox with UBO built-ins, EasyList, AdGuard, Fanboy etc. (ohne Pro++/TIF)" >> ubo_standard_raw.txt
          echo "! Version: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> ubo_standard_raw.txt
          echo "! Homepage: https://github.com/yellowmarker512900/unified-filters" >> ubo_standard_raw.txt
          echo "! License: Same as all upstreams (non-commercial usage)" >> ubo_standard_raw.txt
          echo "" >> ubo_standard_raw.txt

          urls=(
            "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/quick-fixes.txt"
            "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/privacy.txt"
            "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/badware.txt"
            "https://raw.githubusercontent.com/uBlockOrigin/uAssets/refs/heads/master/filters/filters.txt"
            "https://raw.githubusercontent.com/uBlockOrigin/uAssets/master/filters/resource-abuse.txt"
            "https://easylist.to/easylist/easylist.txt"
            "https://easylist.to/easylist/easyprivacy.txt"
            "https://easylist.to/easylist/fanboy-social.txt"
            "https://secure.fanboy.co.nz/fanboy-annoyance.txt"
            "https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_6_German/filter.txt"
            "https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_17_TrackParam/filter.txt"
            "https://raw.githubusercontent.com/AdguardTeam/FiltersRegistry/master/filters/filter_18_Annoyances_Cookies/filter.txt"
            "https://raw.githubusercontent.com/uBlockOrigin/uAssets/refs/heads/master/filters/annoyances-others.txt"
          )

          for url in "${urls[@]}"; do
            filename=$(basename "$url")
            echo -e "\n\n! =============== Source: $filename ===============" >> ubo_standard_raw.txt
            curl -s "$url" | grep -vE '^(!|\s*$)' >> ubo_standard_raw.txt
          done

          # Regeln extrahieren, sortieren und Duplikate entfernen
          grep -v '^!' ubo_standard_raw.txt | sort -u > ubo_standard_sorted.txt

          # Metadaten + sortierte Liste kombinieren
          head -n 7 ubo_standard_raw.txt > ubo_standard.txt
          echo "" >> ubo_standard.txt
          cat ubo_standard_sorted.txt >> ubo_standard.txt

      - name: Check for changes
        run: |
          if git diff --quiet; then
            echo "No changes detected, skipping commit."
            exit 0
          fi

      - name: Commit & Push
        if: success()
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add filters/ubo_standard.txt
          git commit -m "Update UBO Standard Filter List"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} HEAD:main
